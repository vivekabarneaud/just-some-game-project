<title>Valenheart Tree</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Courier+Prime:wght@0,400;0,700&display=swap">
<style>

  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Alegreya", Georgia, serif; font-size: 16px; overflow: hidden; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  .bar { position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: var(--paper); border-bottom: 1px solid var(--rule); }

  .wordmark { font-family: "IM Fell English", Georgia, serif; font-size: 20px; }
  .wordmark em { font-style: italic; color: var(--ink-soft); font-size: 15px; margin-left: 8px; }
  .spacer { flex: 1; }

  .btns button { appearance: none; border: 0; margin: 0; cursor: pointer; padding: 6px 12px; background: transparent; color: var(--ink); font: inherit; letter-spacing: inherit; text-transform: uppercase; }
  .btns button + button { border-left: 1px solid var(--ink); }
  .btns button:hover { background: var(--paper-deep); }
  .btns button:focus-visible { outline: 2px solid var(--candle); outline-offset: -3px; }
  .hint { font-family: "Courier Prime", monospace; font-size: 12px; color: var(--ink-soft); letter-spacing: 0.03em; }

  .legend { position: fixed; left: 12px; bottom: 12px; z-index: 9; background: rgba(232,225,208,0.94); border: 1px solid var(--rule); border-radius: 2px; padding: 10px 12px; font-family: "Courier Prime", monospace; font-size: 12px; letter-spacing: 0.03em; color: var(--ink-soft); display: grid; grid-template-columns: auto auto; gap: 5px 18px; }

  .legend .sw.person { background: #F1DFB6; border-color: var(--candle); }
  .legend .sw.faction { background: #D7DDCB; border-color: var(--moss); }
  .legend .sw.event { background: #F3EEE2; border-color: var(--ink); }
  .legend .sw.place { background: #CFD6D4; border-color: var(--slate); }
  .legend .sw.thread { background: transparent; border-style: dashed; border-color: var(--blood); }
  .legend .ln { display: inline-block; width: 22px; border-top: 2px solid var(--ink); vertical-align: 3px; margin-right: 7px; }
  .legend .ln.family { border-top: 2px dashed var(--candle); }
  .legend .ln.thread { border-top: 2px dotted var(--blood); }
  .legend .ln.member { border-top: 2px solid var(--moss); }

  svg#map { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  svg#map.dragging { cursor: grabbing; }
  .era-label { font-family: "Courier Prime", monospace; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; }
  .era-sub { font-family: "IM Fell English", Georgia, serif; font-style: italic; font-size: 15px; }
  .edge { fill: none; stroke-width: 1.6; opacity: 0.16; transition: opacity .12s; }
  .edge.causes { stroke: var(--ink); }
  .edge.member { stroke: var(--moss); }
  .edge.family { stroke: var(--candle); stroke-dasharray: 6 5; }
  .edge.thread { stroke: var(--blood); stroke-dasharray: 2 5; stroke-width: 2; }
  .edge.hot { opacity: 1; stroke-width: 3; }
  .edge.cold { opacity: 0.05; }
  .node { cursor: pointer; }
  .node rect { stroke-width: 1.6; rx: 3; }
  .node.event rect { fill: #F3EEE2; stroke: var(--ink); }
  .node.person rect { fill: #F1DFB6; stroke: var(--candle); }
  .node.faction rect { fill: #D7DDCB; stroke: var(--moss); }
  .node.place rect { fill: #CFD6D4; stroke: var(--slate); }
  .node.thread rect { fill: #EFE6DE; stroke: var(--blood); stroke-dasharray: 5 4; }
  .node.hub rect { stroke-width: 3; }
  .node text { font-family: "Alegreya", Georgia, serif; font-size: 14px; fill: var(--ink); pointer-events: none; }
  .node .sub { font-family: "Courier Prime", monospace; font-size: 10.5px; fill: var(--ink-soft); letter-spacing: 0.06em; text-transform: uppercase; }
  .node.t1 rect { stroke-width: 3; rx: 4; }
  .node.t1 text { font-family: "IM Fell English", "Alegreya", Georgia, serif; font-size: 23px; }
  .node.t1 .sub { font-size: 12.5px; }
  .node.t2 text { font-size: 15px; }
  .node.t2 .sub { font-size: 11px; }
  .node.t3 text { font-size: 12.5px; }
  .node.t3 .sub { font-size: 10px; }
  .node.t3 rect { stroke-width: 1.2; }
  .essentials .node.t3, .essentials .edge.t3 { display: none; }
  .rhandle { fill: var(--candle); opacity: 0; pointer-events: none; cursor: nwse-resize; }
  .node:hover .rhandle { opacity: 0.85; pointer-events: auto; }
  .node { cursor: move; }
  .node:hover rect, .node.active rect { stroke-width: 3.5; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.25)); }
  .node.cold { opacity: 0.35; }
  .node .known { fill: var(--moss); }
  .node .known.lord { fill: var(--candle); }
  .node .known.hidden { fill: var(--slate); }

  /* modal */
  .overlay { position: fixed; inset: 0; z-index: 20; background: rgba(38,34,27,0.45); display: flex; align-items: flex-start; justify-content: flex-end; }
  .overlay[hidden] { display: none; }
  .panel { width: min(520px, 100%); height: 100%; overflow-y: auto; background: var(--paper); border-left: 1px solid var(--rule); padding: 22px 26px 40px; box-shadow: -8px 0 30px rgba(0,0,0,0.18); }
  .panel .eyebrow { font-family: "Courier Prime", monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .panel h2 { font-family: "IM Fell English", Georgia, serif; font-weight: 400; font-size: 30px; line-height: 1.1; margin: 8px 0 14px; text-wrap: balance; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 2px; font-family: "Courier Prime", monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #fff; }
  .pill.known { background: var(--moss); }
  .pill.lord { background: var(--candle); }
  .pill.hidden { background: var(--slate); }
  .panel p { margin: 0 0 12px; line-height: 1.5; font-size: 16.5px; }
  .panel .bullets { margin: 0 0 12px; padding: 0 0 0 18px; }
  .panel .bullets li { margin: 0 0 7px; line-height: 1.4; font-size: 16px; }
  .panel .bullets li::marker { color: var(--candle); }
  .panel .bullets .sub { margin: 6px 0 4px; padding-left: 20px; }
  .panel .bullets .sub li { font-size: 15.5px; margin: 0 0 5px; }
  .panel .bullets .sub li::marker { color: var(--moss); }
  .panel .bullets strong { font-weight: 700; color: var(--ink); }
  .panel .bullets li.unsure { color: var(--ink-soft); opacity: 0.8; }
  .panel .bullets li.unsure strong { color: var(--ink-soft); font-weight: 500; }
  .panel .bullets li.unsure::marker { color: var(--rule); }
  .panel .bullets .tag { font-family: "Courier Prime", monospace; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid var(--rule); border-radius: 2px; padding: 0 5px; margin-right: 4px; vertical-align: 1px; }
  .panel h3 { font-family: "Courier Prime", monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); margin: 22px 0 8px; border-top: 1px solid var(--rule); padding-top: 12px; }
  .conn { list-style: none; margin: 0; padding: 0; }
  .conn li { padding: 6px 0; border-bottom: 1px solid var(--paper-deep); display: flex; gap: 10px; align-items: baseline; }
  .conn .kind { font-family: "Courier Prime", monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); min-width: 9ch; }
  .conn button { appearance: none; border: 0; background: none; padding: 0; margin: 0; font: inherit; color: var(--ink); cursor: pointer; text-align: left; text-decoration: underline dotted; text-decoration-color: var(--candle); text-underline-offset: 3px; }
  .conn button:hover { text-decoration-style: solid; }
  .close { position: sticky; top: 0; float: right; appearance: none; border: 1px solid var(--ink); background: var(--paper); border-radius: 2px; padding: 4px 10px; font-family: "Courier Prime", monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; }
  .close:focus-visible { outline: 2px solid var(--candle); outline-offset: 2px; }
  .kn-note { font-family: "Courier Prime", monospace; font-size: 12px; color: var(--ink-soft); margin-top: 6px; }
  @media (max-width: 640px) { .legend { display: none; } .hint { display: none; } }
</style>

<script>
(function () {
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var svg = document.getElementById('map');
  var world = document.getElementById('world');
  var gEras = document.getElementById('eras');
  var gEdges = document.getElementById('edges');
  var gNodes = document.getElementById('nodes');
  var NS = 'http://www.w3.org/2000/svg';
  // The data is authored on a 1720 x 2780 grid; spread it out for air.
  var SX = 1.45, SY = 1.18, W = Math.round(1720 * SX), H = Math.round(3420 * SY);
  var byId = {};
  DATA.nodes.forEach(function (n) { byId[n.id] = n; n.x = n.x * SX; n.y = n.y * SY; n.tier = n.tier || 2; });
  DATA.eras.forEach(function (e) { e.y0 = e.y0 * SY; e.y1 = e.y1 * SY; });

  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function textWidth(s, size) { return s.length * size * 0.52; }

  // ---- eras ----
  DATA.eras.forEach(function (e) {
    el('rect', { x: 0, y: e.y0, width: W, height: e.y1 - e.y0, fill: e.fill }, gEras);
    var t = el('text', { x: 24, y: e.y0 + 28, fill: e.text, 'class': 'era-label' }, gEras);
    t.textContent = e.label;
    var s = el('text', { x: 24, y: e.y0 + 50, fill: e.text, 'class': 'era-sub', opacity: 0.85 }, gEras);
    s.textContent = e.sub;
  });

  // ---- nodes: measure ----
  var TIER = {
    1: { font: 23, sub: 12.5, minW: 340, maxW: 520, pad: 64, h: 92 },
    2: { font: 15, sub: 11, minW: 180, maxW: 320, pad: 38, h: 56 },
    3: { font: 12.5, sub: 10, minW: 140, maxW: 260, pad: 30, h: 44 }
  };
  DATA.nodes.forEach(function (n) {
    if (typeof n.w === 'number' && typeof n.h === 'number') return;  // authored size
    var t = TIER[n.tier];
    var w = Math.max(t.minW, textWidth(n.label, t.font) + t.pad, textWidth(n.sub || '', t.sub) + t.pad);
    n.w = Math.min(w, t.maxW); n.h = n.sub ? t.h : Math.round(t.h * 0.78);
  });

  // A hand-made layout, if this browser has one, overrides the authored grid.
  var LKEY = 'valenheart-tree-layout-v1';
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(LKEY) || '{}') || {}; } catch (e) { saved = {}; }
  DATA.nodes.forEach(function (n) {
    var o = saved[n.id];
    if (!o) return;
    if (typeof o.x === 'number') n.x = o.x * SX;
    if (typeof o.y === 'number') n.y = o.y * SY;
    if (typeof o.w === 'number') n.w = o.w;
    if (typeof o.h === 'number') n.h = o.h;
  });

  function anchor(n, other) {
    // exit from bottom/top when vertical distance dominates, else sides
    var dx = other.x - n.x, dy = other.y - n.y;
    if (Math.abs(dy) > Math.abs(dx) * 0.6) return { x: n.x, y: n.y + (dy > 0 ? n.h / 2 : -n.h / 2), v: true };
    return { x: n.x + (dx > 0 ? n.w / 2 : -n.w / 2), y: n.y, v: false };
  }
  function edgePath(a, b) {
    var p = anchor(a, b), q = anchor(b, a);
    if (p.v && q.v) {
      var my = (p.y + q.y) / 2;
      return 'M' + p.x + ',' + p.y + ' C' + p.x + ',' + my + ' ' + q.x + ',' + my + ' ' + q.x + ',' + q.y;
    }
    var mx = (p.x + q.x) / 2;
    return 'M' + p.x + ',' + p.y + ' C' + mx + ',' + p.y + ' ' + mx + ',' + q.y + ' ' + q.x + ',' + q.y;
  }

  // ---- edges ----
  var edgeEls = [];
  DATA.edges.forEach(function (ed) {
    var a = byId[ed[0]], b = byId[ed[1]];
    if (!a || !b) return;
    var kind = ed[2];
    var small = (a.tier === 3 || b.tier === 3) ? ' t3' : '';
    var path = el('path', { d: edgePath(a, b), 'class': 'edge ' + kind + small, 'data-a': a.id, 'data-b': b.id }, gEdges);
    if (kind === 'causes') path.setAttribute('marker-end', 'url(#arrow)');
    if (kind === 'member') path.setAttribute('marker-end', 'url(#arrow-moss)');
    if (kind === 'thread') path.setAttribute('marker-end', 'url(#arrow-blood)');
    edgeEls.push({ el: path, a: a.id, b: b.id, kind: kind, label: ed[3] });
  });

  // ---- nodes ----
  var nodeEls = {}, nodeParts = {};
  DATA.nodes.forEach(function (n) {
    var g = el('g', { 'class': 'node ' + n.type + ' t' + n.tier + (n.hub ? ' hub' : ''), transform: 'translate(' + (n.x - n.w / 2) + ',' + (n.y - n.h / 2) + ')', tabindex: 0, role: 'button', 'aria-label': n.label }, gNodes);
    var box = el('rect', { width: n.w, height: n.h }, g);
    var tf = TIER[n.tier];
    var labelY = n.sub ? Math.round(n.h * 0.46) : Math.round(n.h * 0.5 + tf.font * 0.35);
    var t = el('text', { x: n.w / 2, y: labelY, 'text-anchor': 'middle' }, g);
    t.textContent = n.label;
    var sEl = null;
    if (n.sub) { sEl = el('text', { x: n.w / 2, y: Math.round(n.h * 0.46 + tf.sub * 1.55), 'text-anchor': 'middle', 'class': 'sub' }, g); sEl.textContent = n.sub; }
    el('circle', { cx: 11, cy: 11, r: n.tier === 1 ? 5.5 : 4, 'class': 'known ' + n.known }, g);
    var handle = el('rect', { x: n.w - 12, y: n.h - 12, width: 12, height: 12, 'class': 'rhandle' }, g);
    nodeParts[n.id] = { g: g, rect: box, label: t, sub: sEl, handle: handle };
    handle.addEventListener('pointerdown', function (ev) { startEdit(ev, n, 'size'); });
    g.addEventListener('pointerdown', function (ev) { startEdit(ev, n, 'move'); });
    g.addEventListener('pointerup', function (ev) { if (dragMoved || ev.button !== 0) return; if (edit && edit.moved) return; openNode(n.id); });
    g.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openNode(n.id); } });
    g.addEventListener('mouseenter', function () { highlight(n.id); });
    g.addEventListener('mouseleave', function () { highlight(null); });
    nodeEls[n.id] = g;
  });

  // ---- layout editing: drag to move, corner to resize ----
  var edit = null;

  function placeNode(n) {
    var p = nodeParts[n.id]; if (!p) return;
    p.g.setAttribute('transform', 'translate(' + (n.x - n.w / 2) + ',' + (n.y - n.h / 2) + ')');
    p.rect.setAttribute('width', n.w); p.rect.setAttribute('height', n.h);
    var tf = TIER[n.tier];
    var labelY = n.sub ? Math.round(n.h * 0.46) : Math.round(n.h * 0.5 + tf.font * 0.35);
    p.label.setAttribute('x', n.w / 2); p.label.setAttribute('y', labelY);
    if (p.sub) { p.sub.setAttribute('x', n.w / 2); p.sub.setAttribute('y', Math.round(n.h * 0.46 + tf.sub * 1.55)); }
    p.handle.setAttribute('x', n.w - 12); p.handle.setAttribute('y', n.h - 12);
    edgeEls.forEach(function (e) {
      if (e.a === n.id || e.b === n.id) e.el.setAttribute('d', edgePath(byId[e.a], byId[e.b]));
    });
  }

  function startEdit(ev, n, mode) {
    if (ev.button !== 0) return;
    ev.preventDefault(); ev.stopPropagation();
    edit = { n: n, mode: mode, moved: false, sx: ev.clientX, sy: ev.clientY, ox: n.x, oy: n.y, ow: n.w, oh: n.h };
  }

  window.addEventListener('pointermove', function (ev) {
    if (!edit) return;
    if (Math.abs(ev.clientX - edit.sx) + Math.abs(ev.clientY - edit.sy) > 4) edit.moved = true;
    var dx = (ev.clientX - edit.sx) / k, dy = (ev.clientY - edit.sy) / k;
    if (edit.mode === 'move') { edit.n.x = edit.ox + dx; edit.n.y = edit.oy + dy; }
    else { edit.n.w = Math.max(90, edit.ow + dx); edit.n.h = Math.max(34, edit.oh + dy); }
    placeNode(edit.n);
  });
  window.addEventListener('pointerup', function () { if (edit) { edit = null; saveLayout(); } });

  function layoutData() {
    var out = {};
    DATA.nodes.forEach(function (n) {
      out[n.id] = { x: Math.round(n.x / SX), y: Math.round(n.y / SY), w: Math.round(n.w), h: Math.round(n.h) };
    });
    return out;
  }
  function saveLayout() {
    try { localStorage.setItem(LKEY, JSON.stringify(layoutData())); } catch (e) { /* private window */ }
  }

  document.getElementById('b-reset').addEventListener('click', function (ev) {
    try { localStorage.removeItem(LKEY); } catch (e) { /* ignore */ }
    ev.currentTarget.textContent = 'Reload to reset';
  });
  document.getElementById('b-copy').addEventListener('click', function (ev) {
    var txt = JSON.stringify(layoutData());
    var btn = ev.currentTarget;
    function done(ok) { btn.textContent = ok ? 'Copied' : 'Press ctrl+C'; setTimeout(function () { btn.textContent = 'Copy layout'; }, 2500); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { done(true); }, function () { fallback(); });
    } else fallback();
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.top = '-1000px';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(true); } catch (e) { done(false); }
      document.body.removeChild(ta);
    }
  });

  function highlight(id) {
    if (!id) {
      edgeEls.forEach(function (e) { e.el.classList.remove('hot', 'cold'); });
      Object.keys(nodeEls).forEach(function (k) { nodeEls[k].classList.remove('cold'); });
      return;
    }
    var near = {}; near[id] = true;
    edgeEls.forEach(function (e) {
      var on = e.a === id || e.b === id;
      e.el.classList.toggle('hot', on); e.el.classList.toggle('cold', !on);
      if (on) { near[e.a] = true; near[e.b] = true; }
    });
    Object.keys(nodeEls).forEach(function (k) { nodeEls[k].classList.toggle('cold', !near[k]); });
  }

  // ---- pan / zoom ----
  var tx = 0, ty = 0, k = 1;
  function apply() { world.setAttribute('transform', 'translate(' + tx + ',' + ty + ') scale(' + k + ')'); }
  function vp() { var r = svg.getBoundingClientRect(); return { w: r.width, h: r.height, top: 52 }; }
  function fitAll() {
    var v = vp();
    k = Math.min(v.w / W, (v.h - v.top) / H) * 0.97;
    tx = (v.w - W * k) / 2; ty = v.top + ((v.h - v.top) - H * k) / 2; apply();
  }
  function centerOn(x, y, zoom) {
    var v = vp(); k = zoom; tx = v.w / 2 - x * k; ty = v.top + (v.h - v.top) / 2 - y * k; apply();
  }
  function zoomAt(f, cx, cy) {
    var nk = Math.max(0.18, Math.min(3.5, k * f));
    tx = cx - (cx - tx) * (nk / k); ty = cy - (cy - ty) * (nk / k); k = nk; apply();
  }
  svg.addEventListener('wheel', function (ev) {
    ev.preventDefault();
    var f = Math.exp(-ev.deltaY * 0.0015);
    zoomAt(f, ev.clientX, ev.clientY);
  }, { passive: false });

  var dragging = false, dragMoved = false, sx = 0, sy = 0, ox = 0, oy = 0;
  svg.addEventListener('pointerdown', function (ev) {
    if (ev.button !== 0 || edit) return;
    dragging = true; dragMoved = false; sx = ev.clientX; sy = ev.clientY; ox = tx; oy = ty;
    svg.classList.add('dragging');
  });
  window.addEventListener('pointermove', function (ev) {
    if (!dragging || edit) return;
    var dx = ev.clientX - sx, dy = ev.clientY - sy;
    if (Math.abs(dx) + Math.abs(dy) > 4) dragMoved = true;
    tx = ox + dx; ty = oy + dy; apply();
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false; svg.classList.remove('dragging');
    setTimeout(function () { dragMoved = false; }, 0);
  }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  document.getElementById('b-fit').addEventListener('click', fitAll);
  document.getElementById('b-in').addEventListener('click', function () { var v = vp(); zoomAt(1.3, v.w / 2, v.h / 2); });
  document.getElementById('b-out').addEventListener('click', function () { var v = vp(); zoomAt(1 / 1.3, v.w / 2, v.h / 2); });
  document.getElementById('b-top').addEventListener('click', function () { centerOn(W / 2, 330 * SY, 0.7); });
  document.getElementById('b-now').addEventListener('click', function () { centerOn(W / 2, 2330 * SY, 0.5); });
  var essentials = false;
  var bEss = document.getElementById('b-ess');
  bEss.addEventListener('click', function () {
    essentials = !essentials;
    document.body.classList.toggle('essentials', essentials);
    bEss.setAttribute('aria-pressed', essentials ? 'true' : 'false');
    bEss.textContent = essentials ? 'Everything' : 'Essentials';
  });
  window.addEventListener('resize', function () { /* keep current view */ });

  // ---- panel ----
  var overlay = document.getElementById('overlay');
  var pE = document.getElementById('p-eyebrow'), pT = document.getElementById('p-title'), pB = document.getElementById('p-body'), pC = document.getElementById('p-conn');
  var KNOWN = { known: 'the player learns this in Act 1', lord: 'the Lord knows this as common history', hidden: 'hidden from the player' };
  var TYPE = { person: 'person', event: 'event', faction: 'people, faction', place: 'place', thread: 'story beat' };
  var KIND = { causes: 'leads to', member: 'belongs to', family: 'family, bond', thread: 'thread' };
  function eraOf(n) { for (var i = 0; i < DATA.eras.length; i++) { var e = DATA.eras[i]; if (n.y >= e.y0 && n.y < e.y1) return e.label; } return ''; }
  var activeId = null;
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function inline(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }
  // Bullets: a string starting with two spaces is a sub-bullet of the previous top-level bullet.
  // A bullet starting with "~ " is undecided: rendered grey with a tag.
  function li(text) {
    var t = text.trim();
    if (t.charAt(0) === '~') return '<li class="unsure"><span class="tag">undecided</span> ' + inline(t.slice(1).trim()) + '</li>';
    if (t.charAt(0) === '+') return '<li class="unsure"><span class="tag">to deepen</span> ' + inline(t.slice(1).trim()) + '</li>';
    return '<li>' + inline(t) + '</li>';
  }
  function renderBullets(list) {
    var isSub = function (b) { return /^\s\s/.test(b); };
    var h = '<ul class="bullets">', i = 0;
    while (i < list.length) {
      if (isSub(list[i])) { i++; continue; } // a stray sub-bullet with no parent is skipped
      var item = li(list[i]);
      i++;
      if (i < list.length && isSub(list[i])) {
        var subs = '<ul class="sub">';
        while (i < list.length && isSub(list[i])) { subs += li(list[i]); i++; }
        item = item.slice(0, -5) + subs + '</ul></li>';
      }
      h += item;
    }
    return h + '</ul>';
  }

  function openNode(id, noMove) {
    var n = byId[id]; if (!n) return;
    if (activeId && nodeEls[activeId]) nodeEls[activeId].classList.remove('active');
    activeId = id; nodeEls[id].classList.add('active');
    pE.innerHTML = '<span>' + esc(TYPE[n.type] || n.type) + '</span><span>·</span><span>' + esc(eraOf(n)) + '</span><span class="pill ' + n.known + '">' + (n.known === 'known' ? 'player knows' : n.known === 'lord' ? 'Lord knows' : 'hidden') + '</span>';
    pT.textContent = n.label;
    var body = n.bullets ? renderBullets(n.bullets) : (n.facts || []).map(function (f) { return '<p>' + esc(f) + '</p>'; }).join('');
    pB.innerHTML = body + '<p class="kn-note">' + esc(KNOWN[n.known]) + '</p>';
    var rows = [];
    edgeEls.forEach(function (e) {
      if (e.a === id) rows.push({ other: e.b, kind: e.kind, label: e.label, dir: '→' });
      else if (e.b === id) rows.push({ other: e.a, kind: e.kind, label: e.label, dir: '←' });
    });
    pC.innerHTML = rows.map(function (r) {
      var o = byId[r.other];
      return '<li><span class="kind">' + esc(r.dir + ' ' + (KIND[r.kind] || r.kind)) + '</span><button type="button" data-go="' + esc(o.id) + '">' + esc(o.label) + (r.label ? ' <span style="color:var(--ink-soft)">(' + esc(r.label) + ')</span>' : '') + '</button></li>';
    }).join('') || '<li><span class="kind">none</span></li>';
    overlay.hidden = false;
    highlight(id);
    // The map does not move when the panel opens; the view is the reader's.
    document.getElementById('p-close').focus();
  }
  function closePanel() {
    overlay.hidden = true;
    if (activeId && nodeEls[activeId]) { nodeEls[activeId].classList.remove('active'); nodeEls[activeId].focus(); }
    activeId = null; highlight(null);
  }
  document.getElementById('p-close').addEventListener('click', closePanel);
  overlay.addEventListener('click', function (ev) { if (ev.target === overlay) closePanel(); });
  pC.addEventListener('click', function (ev) { var b = ev.target.closest('button[data-go]'); if (b) openNode(b.getAttribute('data-go')); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !overlay.hidden) closePanel(); });

  fitAll();
})();
</script>

</body></html>
